    <style>
      /* ========== THEME VARIABLES ========== */
      /* Warm dark palette — no cold blue-blacks */
      :root {
        --bg-base: #0c0c0e;
        --bg-50: #111114;
        --bg-100: #17171b;
        --bg-200: #1e1e23;
        --bg-300: #27272e;
        --text-primary: #ece8e1;
        --text-secondary: #9a9590;
        --text-muted: #5c5955;
        --accent: #c8ff00;
        --accent-soft: rgba(200, 255, 0, 0.12);
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-bg-strong: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-border-strong: rgba(255, 255, 255, 0.1);
        --grid-line: rgba(255, 255, 255, 0.02);
        --scrollbar-track: #0c0c0e;
        --scrollbar-thumb: rgba(255, 255, 255, 0.08);
        --scrollbar-thumb-hover: rgba(255, 255, 255, 0.15);
        --selection-bg: rgba(200, 255, 0, 0.25);
        --card-hover-bg: rgba(255, 255, 255, 0.04);
        --noise-opacity: 0.025;
        --input-focus-shadow: 0 0 0 2px rgba(200, 255, 0, 0.2), 0 0 20px rgba(200, 255, 0, 0.05);
      }

      html.light {
        --bg-base: #f5f2ed;
        --bg-50: #ece8e1;
        --bg-100: #e2ddd5;
        --bg-200: #d6d0c7;
        --bg-300: #c5bfb5;
        --text-primary: #1a1a1e;
        --text-secondary: #4a4843;
        --text-muted: #8a8680;
        --accent: #0038ff;
        --accent-soft: rgba(0, 56, 255, 0.1);
        --glass-bg: rgba(255, 255, 255, 0.5);
        --glass-bg-strong: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.06);
        --glass-border-strong: rgba(0, 0, 0, 0.1);
        --grid-line: rgba(0, 0, 0, 0.04);
        --scrollbar-track: #f5f2ed;
        --scrollbar-thumb: rgba(0, 0, 0, 0.1);
        --scrollbar-thumb-hover: rgba(0, 0, 0, 0.2);
        --selection-bg: rgba(0, 56, 255, 0.15);
        --card-hover-bg: rgba(0, 56, 255, 0.04);
        --noise-opacity: 0.02;
        --input-focus-shadow: 0 0 0 2px rgba(0, 56, 255, 0.15), 0 0 20px rgba(0, 56, 255, 0.05);
      }

      /* ========== BASE ========== */
      * { box-sizing: border-box; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg-base);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        transition: background-color 0.4s ease, color 0.4s ease;
      }

      /* ========== SCROLL REVEAL SYSTEM ========== */
      .sr {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sr.revealed {
        opacity: 1;
        transform: translateY(0);
      }
      .sr-scale {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .sr-scale.revealed {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      .sr-delay-1 { transition-delay: 100ms; }
      .sr-delay-2 { transition-delay: 200ms; }
      .sr-delay-3 { transition-delay: 300ms; }
      .sr-delay-4 { transition-delay: 400ms; }
      .sr-delay-5 { transition-delay: 500ms; }
      .sr-delay-6 { transition-delay: 600ms; }
      .sr-delay-7 { transition-delay: 700ms; }
      .sr-delay-8 { transition-delay: 800ms; }

      /* ========== GLASSMORPHISM ========== */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        transition: background 0.4s ease, border-color 0.4s ease;
      }
      .glass-strong {
        background: var(--glass-bg-strong);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border-strong);
        transition: background 0.4s ease, border-color 0.4s ease;
      }

      /* ========== CURSOR GLOW ========== */
      .cursor-glow {
        position: fixed;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(200, 255, 0, 0.025) 0%, transparent 70%);
        transform: translate(-50%, -50%);
        z-index: 1;
        transition: left 0.15s ease-out, top 0.15s ease-out;
        will-change: left, top;
      }

      /* ========== PAGE LOADER ========== */
      .page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: var(--bg-base);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      .page-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .page-loader .loader-bar {
        width: 60px;
        height: 2px;
        background: var(--glass-border);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .page-loader .loader-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--accent);
        border-radius: 2px;
        animation: loaderFill 1.2s ease-out forwards;
      }
      @keyframes loaderFill {
        from { transform: scaleX(0); transform-origin: left; }
        to { transform: scaleX(1); transform-origin: left; }
      }

      /* ========== SMOOTH SCROLL PROGRESS BAR ========== */
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: var(--accent);
        z-index: 9999;
        transform-origin: left;
        transition: transform 0.1s linear;
      }

      /* ========== BOUNCE SLOW ========== */
      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }

      /* ========== ACCENT COLOR ========== */
      .text-accent { color: var(--accent); }
      .bg-accent { background-color: var(--accent); }
      .bg-accent-soft { background-color: var(--accent-soft); }
      .border-accent { border-color: var(--accent); }

      /* ========== TEXT GRADIENT ========== */
      .text-gradient {
        background: linear-gradient(135deg, var(--accent), #ece8e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .text-gradient-animated {
        background: linear-gradient(270deg, var(--accent), #ece8e1, var(--accent), #ece8e1);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 8s ease infinite;
      }

      /* ========== CARD GLOW BORDER ========== */
      .card-glow {
        position: relative;
        overflow: hidden;
      }
      .card-glow::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, transparent, transparent);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        transition: background 0.5s ease;
        pointer-events: none;
      }
      .card-glow:hover::before {
        background: linear-gradient(135deg, rgba(200,255,0,0.15), rgba(255,255,255,0.05), rgba(200,255,0,0.15));
      }
      html.light .card-glow:hover::before {
        background: linear-gradient(135deg, rgba(0,56,255,0.15), rgba(0,0,0,0.03), rgba(0,56,255,0.15));
      }

      /* ========== BUTTON LIGHT SWEEP ========== */
      .btn-sweep {
        position: relative;
        overflow: hidden;
      }
      .btn-sweep::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.6s ease;
      }
      .btn-sweep:hover::after {
        left: 120%;
      }

      /* ========== NOISE TEXTURE ========== */
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        opacity: var(--noise-opacity);
      }

      /* ========== DARK GRID ========== */
      .bg-grid-dark {
        background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 64px 64px;
      }

      /* ========== ANIMATION DELAYS ========== */
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }
      .animation-delay-6000 { animation-delay: 6s; }

      /* ========== SCROLLBAR ========== */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Custom thin scrollbar for body */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

      /* ========== GLOW UTILITIES ========== */
      .glow-blue { box-shadow: 0 0 40px rgba(59, 130, 246, 0.15), 0 0 80px rgba(59, 130, 246, 0.05); }
      .glow-purple { box-shadow: 0 0 40px rgba(139, 92, 246, 0.15), 0 0 80px rgba(139, 92, 246, 0.05); }
      .glow-indigo { box-shadow: 0 0 40px rgba(99, 102, 241, 0.15), 0 0 80px rgba(99, 102, 241, 0.05); }

      /* ========== PERSPECTIVE ========== */
      h1, h2 { perspective: 1000px; transform-style: preserve-3d; }

      /* ========== FOCUS GLOW FOR INPUTS ========== */
      input:focus, textarea:focus {
        box-shadow: var(--input-focus-shadow);
      }

      /* ========== LIGHT RAY ACCENTS ========== */
      .light-ray {
        position: absolute;
        width: 1px;
        height: 200px;
        background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, 0.1), transparent);
        transform: rotate(45deg);
        pointer-events: none;
      }

      /* ========== SELECTION ========== */
      ::selection {
        background: var(--selection-bg);
        color: var(--text-primary);
      }

      /* ========== LIGHT THEME OVERRIDES ========== */
      html.light .cursor-glow {
        background: radial-gradient(circle, rgba(0, 56, 255, 0.04) 0%, transparent 70%);
      }
      html.light .text-gradient {
        background: linear-gradient(135deg, var(--accent), #1a1a1e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      html.light .text-gradient-animated {
        background: linear-gradient(270deg, var(--accent), #1a1a1e, var(--accent), #1a1a1e);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 8s ease infinite;
      }

      /* ========== THEME-AWARE TEXT ========== */
      .text-heading { color: var(--text-primary); }
      .text-body { color: var(--text-secondary); }
      .text-muted-theme { color: var(--text-muted); }
    </style>
